<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Content</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Course Content</h1>
      <p class="subtitle">Click a lesson to open its video in Telegram. Status is saved in this browser.</p>
    </header>
    <div class="overall">
      <div class="overall-label">Overall progress</div>
      <div id="overall-progress"></div>
    </div>
    <input id="search" class="search" type="search" placeholder="Search lessons…" autocomplete="off" />
    <div id="status" class="status"></div>
    <div id="list"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
